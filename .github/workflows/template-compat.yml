# Receives a repository_dispatch from piers-sinclair/Dostar on every push to main,
# scaffolds a real project from the template, builds it, tests it, and posts the
# result back as a commit status on the triggering Dostar SHA.
#
# Required secret: DOSTAR_STATUS_PAT — fine-grained PAT with Commit statuses: write
# permission on piers-sinclair/Dostar. See CONTRIBUTING.md for setup steps.

name: CI — template compatibility

on:
  repository_dispatch:
    types: [template-updated]

jobs:
  compat:
    name: Scaffold, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dostar.Cli
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build CLI
        run: dotnet build --no-restore -c Release

      - name: Pack CLI
        run: dotnet pack --no-build -c Release -o ./nupkg

      - name: Install CLI from source
        run: dotnet tool install --global dostar --add-source ./nupkg

      - name: Scaffold test project from template
        run: dostar new-project TestApp --owner test-org --author "Test Author" --output ./TestApp

      - name: Restore scaffolded project
        working-directory: TestApp
        run: dotnet restore

      - name: Build scaffolded project
        working-directory: TestApp
        run: dotnet build --no-restore -warnaserror

      - name: Test scaffolded project
        working-directory: TestApp
        run: dotnet test --no-build

      - name: Report status
        if: always()
        uses: actions/github-script@v7
        env:
          DOSTAR_REPO: ${{ github.event.client_payload.repo }}
          DOSTAR_SHA: ${{ github.event.client_payload.sha }}
          JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ secrets.DOSTAR_STATUS_PAT }}
          script: |
            const [owner, repo] = process.env.DOSTAR_REPO.split('/');
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.DOSTAR_SHA,
              state,
              context: 'CLI compatibility',
              description: state === 'success' ? 'Scaffold, build and test passed' : 'Scaffold, build or test failed',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
