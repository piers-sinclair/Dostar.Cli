# Publishes Dostar.Cli to NuGet.org when a GitHub Release is created.
#
# This workflow is the second half of the release pipeline:
#
#   release-please.yml  →  creates the GitHub Release + git tag
#   nuget-publish.yml   →  fires on that release event and pushes to NuGet
#
# The version packed into the .nupkg comes directly from <Version> in
# Dostar.Cli.csproj, which release-please already bumped in its Release PR.
#
# Prerequisites:
#   NUGET_API_KEY secret must be set in repo Settings → Secrets → Actions.
#   The key must have "Push new packages and package versions" scope on NuGet.org
#   for the Dostar.Cli package.

name: NuGet Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack --configuration Release --output nupkg

      - name: Push to NuGet
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
